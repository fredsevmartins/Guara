name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python scripts/check_docs.py
      - name: Full POSIX suite
        if: runner.os != 'Windows'
        run: python -m pytest --junitxml=test-results.xml
      - name: Windows metadata, CLI, MCP and portable backup suite
        if: runner.os == 'Windows'
        run: python -m pytest tests/test_interfaces.py tests/test_portable.py tests/test_scaling_migration.py tests/test_usability.py tests/test_release_bundle.py tests/test_cli_workflows.py --junitxml=test-results.xml
      - run: python -m examples.scenarios
      - run: python -m examples.tutorial
      - run: python -m build
      - run: python scripts/prepare_release.py
      - run: python scripts/wheel_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            test-results.xml
            dist/*
            release-assets/*
