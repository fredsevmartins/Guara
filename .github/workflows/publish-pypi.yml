name: Publish to PyPI (manual)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tested version tag, for example v0.1.2
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag and package version
        env:
          PACKAGE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, tomllib
          tag = os.environ['PACKAGE_TAG']
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert tag == 'v' + version
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == subprocess.check_output(['git','rev-parse','refs/tags/' + tag + '^{}'],text=True).strip()
          PY
      - run: python -m pip install -e ".[dev]" twine
      - run: ruff check .
      - run: python -m pytest
      - run: python -m examples.tutorial
      - run: python -m build
      - run: twine check --strict dist/*
      - run: python scripts/wheel_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-packages
          path: dist/*
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-packages
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
